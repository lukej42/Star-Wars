trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
- checkout: self
  fetchDepth: 1

- script: |
    sudo rm -rf /usr/share/dotnet/sdk-doc
    sudo rm -rf /usr/local/lib/android
    sudo rm -rf /opt/hostedtoolcache/CodeQL
    sudo rm -rf "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/PyPy" "$AGENT_TOOLSDIRECTORY/go"
    df -h /
  displayName: 'Free agent disk space'

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'

- script: |
    set -euo pipefail

    publishDir="$(Pipeline.Workspace)/publish-output"
    rm -rf "$publishDir"
    mkdir -p "$publishDir"

    dotnet restore "$(Build.SourcesDirectory)/Server/Star-Wars.Server.csproj"
    dotnet publish "$(Build.SourcesDirectory)/Server/Star-Wars.Server.csproj" \
      --configuration Release \
      --no-restore \
      --output "$publishDir"

    echo "Publish output at $publishDir:"
    ls -la "$publishDir"

    if [ ! -f "$publishDir/Star-Wars.Server.dll" ]; then
      echo "Star-Wars.Server.dll not at expected path; searching..."
      found="$(find "$(Build.SourcesDirectory)" "$(Pipeline.Workspace)" -name 'Star-Wars.Server.dll' -print -quit || true)"
      if [ -z "$found" ]; then
        echo "##vso[task.logissue type=error]Star-Wars.Server.dll was not found after publish."
        exit 1
      fi
      publishDir="$(dirname "$found")"
      echo "Using publish directory: $publishDir"
    fi

    if [ ! -f "$publishDir/wwwroot/index.html" ]; then
      echo "##vso[task.logissue type=error]wwwroot/index.html was not found in publish output."
      exit 1
    fi

    cd "$publishDir"
    zip -r "$(Build.ArtifactStagingDirectory)/site.zip" .
    ls -lh "$(Build.ArtifactStagingDirectory)/site.zip"

    rm -rf "$publishDir" \
      "$(Build.SourcesDirectory)/bin" \
      "$(Build.SourcesDirectory)/obj" \
      "$(Build.SourcesDirectory)/Server/bin" \
      "$(Build.SourcesDirectory)/Server/obj"
    df -h /
  displayName: 'Publish and package ASP.NET Core host'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'Azure subscription 1(2)(525c7c1f-f5e9-4bf4-8d7a-5b7a06889a12)'
    appType: 'webAppLinux'
    appName: 'Star-wars'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'
