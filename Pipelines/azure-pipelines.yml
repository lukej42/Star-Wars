trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Agent.TempDirectory)/blazor-publish'

steps:
- checkout: self
  fetchDepth: 1

- script: |
    sudo rm -rf /usr/share/dotnet/sdk-doc
    sudo rm -rf /usr/local/lib/android
    sudo rm -rf /opt/hostedtoolcache/CodeQL
    sudo rm -rf "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/PyPy" "$AGENT_TOOLSDIRECTORY/go"
    df -h /
  displayName: 'Free agent disk space'

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(Build.SourcesDirectory)/Star-Wars.csproj'
    workingDirectory: '$(Build.SourcesDirectory)'

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    projects: '$(Build.SourcesDirectory)/Star-Wars.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(publishDir)'
    workingDirectory: '$(Build.SourcesDirectory)'
    zipAfterPublish: false

- script: |
    set -euo pipefail

    echo "Publish output:"
    ls -la "$(publishDir)" || true

    webroot="$(publishDir)/wwwroot"
    if [ ! -f "$webroot/index.html" ]; then
      found="$(find "$(Build.SourcesDirectory)" "$(Agent.TempDirectory)" -path '*/wwwroot/index.html' -print -quit 2>/dev/null || true)"
      if [ -n "$found" ]; then
        webroot="$(dirname "$found")"
      fi
    fi

    if [ ! -f "$webroot/index.html" ]; then
      echo "##vso[task.logissue type=error]Published index.html was not found."
      echo "Searched publishDir and build output folders."
      find "$(Build.SourcesDirectory)" "$(Agent.TempDirectory)" -name 'index.html' 2>/dev/null | head -20 || true
      exit 1
    fi

    echo "Packaging $webroot"
    cd "$webroot"
    zip -r "$(Build.ArtifactStagingDirectory)/site.zip" .
    ls -lh "$(Build.ArtifactStagingDirectory)/site.zip"
    rm -rf "$(publishDir)" "$(Build.SourcesDirectory)/bin" "$(Build.SourcesDirectory)/obj"
    df -h /
  displayName: 'Package Blazor site for deployment'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'Azure subscription 1(2)(525c7c1f-f5e9-4bf4-8d7a-5b7a06889a12)'
    appType: 'webAppLinux'
    appName: 'Star-wars'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'
