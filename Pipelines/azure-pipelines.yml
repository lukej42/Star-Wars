trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Agent.TempDirectory)/blazor-publish'

steps:
- checkout: self
  fetchDepth: 1

- script: |
    sudo rm -rf /usr/share/dotnet/sdk-doc
    sudo rm -rf /usr/local/lib/android
    sudo rm -rf /opt/hostedtoolcache/CodeQL
    sudo rm -rf "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/PyPy" "$AGENT_TOOLSDIRECTORY/go"
    df -h /
  displayName: 'Free agent disk space'

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(Build.SourcesDirectory)/Server/Star-Wars.Server.csproj'
    workingDirectory: '$(Build.SourcesDirectory)'

- task: DotNetCoreCLI@2
  displayName: 'Publish server + Blazor WASM client'
  inputs:
    command: 'publish'
    projects: '$(Build.SourcesDirectory)/Server/Star-Wars.Server.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(publishDir)'
    workingDirectory: '$(Build.SourcesDirectory)'
    zipAfterPublish: false

- script: |
    set -euo pipefail

    echo "Publish output:"
    ls -la "$(publishDir)"

    if [ ! -f "$(publishDir)/Star-Wars.Server.dll" ]; then
      echo "##vso[task.logissue type=error]Star-Wars.Server.dll was not found in publish output."
      exit 1
    fi

    if [ ! -f "$(publishDir)/wwwroot/index.html" ]; then
      echo "##vso[task.logissue type=error]wwwroot/index.html was not found in publish output."
      exit 1
    fi

    cd "$(publishDir)"
    zip -r "$(Build.ArtifactStagingDirectory)/site.zip" .
    ls -lh "$(Build.ArtifactStagingDirectory)/site.zip"
    rm -rf "$(publishDir)" "$(Build.SourcesDirectory)/bin" "$(Build.SourcesDirectory)/obj" "$(Build.SourcesDirectory)/Server/bin" "$(Build.SourcesDirectory)/Server/obj"
    df -h /
  displayName: 'Package ASP.NET Core host for deployment'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'Azure subscription 1(2)(525c7c1f-f5e9-4bf4-8d7a-5b7a06889a12)'
    appType: 'webAppLinux'
    appName: 'Star-wars'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'
