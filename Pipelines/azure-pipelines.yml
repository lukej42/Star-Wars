trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'

steps:
- checkout: self
  fetchDepth: 1

- script: |
    sudo rm -rf /usr/share/dotnet/sdk-doc
    sudo rm -rf /usr/local/lib/android
    sudo rm -rf /opt/hostedtoolcache/CodeQL
    sudo rm -rf "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/PyPy" "$AGENT_TOOLSDIRECTORY/go"
    df -h /
  displayName: 'Free agent disk space'

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: 'Star-Wars.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    projects: 'Star-Wars.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(publishDir)'
    zipAfterPublish: false

- task: ArchiveFiles@2
  displayName: 'Package Blazor wwwroot for deployment'
  inputs:
    rootFolderOrFile: '$(publishDir)/wwwroot'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
    replaceExistingArchive: true

- script: |
    rm -rf "$(publishDir)" "$(Build.SourcesDirectory)"
    df -h /
  displayName: 'Remove source and publish folders before deploy'
  condition: succeeded()

- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'Azure subscription 1(2)(525c7c1f-f5e9-4bf4-8d7a-5b7a06889a12)'
    appType: 'webAppLinux'
    appName: 'Star-wars'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'
