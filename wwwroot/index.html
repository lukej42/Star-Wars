<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Wars</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/webp" href="favicon.webp" />
    <link href="Star-Wars.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.starWarsMap = {
            positionPanel(viewport, clientX, clientY, panelWidth, panelHeight) {
                const rect = viewport.getBoundingClientRect();
                const clickX = clientX - rect.left;
                const clickY = clientY - rect.top;
                const offset = 16;
                let left = clickX + offset;
                let top = clickY - panelHeight - offset;

                if (top < 8) {
                    top = clickY + offset;
                }

                if (left + panelWidth > rect.width - 8) {
                    left = clickX - panelWidth - offset;
                }

                if (left < 8) {
                    left = 8;
                }

                if (top + panelHeight > rect.height - 8) {
                    top = Math.max(8, rect.height - panelHeight - 8);
                }

                return { left, top };
            }
        };

        window.starWarsNav = {
            _initialized: false,
            _flyoutsBound: false,
            _closeTimer: null,
            _onMouseEnter: null,
            _onMouseLeave: null,
            _onFlyoutOver: null,
            _onFlyoutOut: null,
            _onFlyoutLeave: null,
            _onFlyoutPosition: null,
            _flyoutCloseDelayMs: 280,

            init() {
                if (!this._initialized) {
                this._onMouseEnter = (event) => {
                    const bottomFlyout = event.target.closest('.nav-flyout-bottom');
                    if (!bottomFlyout) {
                        return;
                    }

                    const mainMenu = bottomFlyout.querySelector(':scope > .nav-flyout-menu');
                    if (mainMenu && (event.target === bottomFlyout || mainMenu.contains(event.target) || bottomFlyout.querySelector('.nav-flyout-trigger')?.contains(event.target))) {
                        this.adjustBottomFlyout(mainMenu);
                    }

                    const subflyout = event.target.closest('.nav-flyout-bottom .nav-subflyout');
                    if (subflyout && bottomFlyout.contains(subflyout)) {
                        this.adjustSubflyout(subflyout);
                    }

                    this.repositionBottomFlyouts(event.target);
                };

                this._onMouseLeave = (event) => {
                    const subflyout = event.target.closest('.nav-flyout-bottom .nav-subflyout');
                    if (subflyout && !subflyout.contains(event.relatedTarget)) {
                        this.resetSubflyout(subflyout);
                    }

                    const bottomFlyout = event.target.closest('.nav-flyout-bottom');
                    if (bottomFlyout && !bottomFlyout.contains(event.relatedTarget)) {
                        const mainMenu = bottomFlyout.querySelector(':scope > .nav-flyout-menu');
                        if (mainMenu) {
                            this.resetBottomFlyout(mainMenu);
                        }
                    }
                };

                this._onFlyoutPosition = () => {
                    if (!window.matchMedia('(min-width: 641px)').matches) {
                        return;
                    }

                    document.querySelectorAll('.nav-flyout-bottom').forEach((bottomFlyout) => {
                        const mainMenu = bottomFlyout.querySelector(':scope > .nav-flyout-menu');
                        if (mainMenu && (bottomFlyout.matches(':hover') || mainMenu.matches(':hover'))) {
                            this.adjustBottomFlyout(mainMenu);
                        }

                        bottomFlyout.querySelectorAll('.nav-subflyout:hover').forEach((subflyout) => {
                            this.adjustSubflyout(subflyout);
                        });
                    });
                };

                document.addEventListener('mouseover', this._onMouseEnter);
                document.addEventListener('mouseout', this._onMouseLeave);
                window.addEventListener('resize', this._onFlyoutPosition);
                this._initialized = true;
                }

                this.initDesktopFlyouts();
            },

            _isDesktopNav() {
                return window.matchMedia('(min-width: 641px)').matches;
            },

            _isFlyoutRelated(element) {
                if (!(element instanceof Element)) {
                    return false;
                }

                const navRoot = document.querySelector('.nav-scrollable');
                if (!navRoot || !navRoot.contains(element)) {
                    return false;
                }

                if (element.closest('.nav-flyout-menu, .nav-subflyout-menu')) {
                    return true;
                }

                return !!element.closest('.nav-item.nav-flyout .nav-flyout-trigger, .nav-item.nav-flyout .nav-subflyout-trigger, .nav-item.nav-flyout .nav-flyout-link');
            },

            _closeAllFlyouts() {
                const navRoot = document.querySelector('.nav-scrollable');
                if (!navRoot) {
                    return;
                }

                if (this._closeTimer) {
                    clearTimeout(this._closeTimer);
                    this._closeTimer = null;
                }

                navRoot.querySelectorAll('.is-flyout-open').forEach((element) => {
                    element.classList.remove('is-flyout-open');
                });
                navRoot.querySelectorAll('.is-subflyout-open').forEach((element) => {
                    element.classList.remove('is-subflyout-open');
                });
            },

            closeAllFlyouts() {
                this._closeAllFlyouts();
            },

            dismissFlyouts() {
                const navRoot = document.querySelector('.nav-scrollable');
                if (!navRoot) {
                    return;
                }

                this._closeAllFlyouts();

                navRoot.querySelectorAll('.nav-flyout-bottom').forEach((bottomFlyout) => {
                    const mainMenu = bottomFlyout.querySelector(':scope > .nav-flyout-menu');
                    if (mainMenu) {
                        this.resetBottomFlyout(mainMenu);
                    }
                });

                navRoot.querySelectorAll('.nav-subflyout').forEach((subflyout) => {
                    this.resetSubflyout(subflyout);
                });

                if (this._isDesktopNav()) {
                    navRoot.classList.add('nav-flyouts-dismissed');
                }
            },

            clearFlyoutDismissal() {
                document.querySelector('.nav-scrollable')?.classList.remove('nav-flyouts-dismissed');
            },

            _openFlyoutPath(target) {
                const navRoot = document.querySelector('.nav-scrollable');
                if (!navRoot || !this._isDesktopNav()) {
                    return;
                }

                if (this._closeTimer) {
                    clearTimeout(this._closeTimer);
                    this._closeTimer = null;
                }

                const activeRoot = target.closest('.nav-item.nav-flyout');
                const activeSubflyouts = new Set();

                let node = target;
                while (node && navRoot.contains(node)) {
                    if (node.classList?.contains('nav-subflyout')) {
                        activeSubflyouts.add(node);
                    }
                    node = node.parentElement;
                }

                navRoot.querySelectorAll('.is-flyout-open').forEach((element) => {
                    if (element !== activeRoot) {
                        element.classList.remove('is-flyout-open');
                    }
                });

                navRoot.querySelectorAll('.is-subflyout-open').forEach((element) => {
                    if (!activeSubflyouts.has(element)) {
                        element.classList.remove('is-subflyout-open');
                    }
                });

                activeSubflyouts.forEach((subflyout) => {
                    subflyout.classList.add('is-subflyout-open');
                });

                if (activeRoot) {
                    activeRoot.classList.add('is-flyout-open');
                }
            },

            _scheduleFlyoutClose() {
                const navRoot = document.querySelector('.nav-scrollable');
                if (!navRoot) {
                    return;
                }

                if (this._closeTimer) {
                    clearTimeout(this._closeTimer);
                }

                this._closeTimer = setTimeout(() => {
                    this._closeAllFlyouts();
                }, this._flyoutCloseDelayMs);
            },

            _isWithinSameFlyoutRoot(source, related) {
                if (!(related instanceof Element)) {
                    return false;
                }

                const sourceRoot = source.closest('.nav-item.nav-flyout');
                if (!sourceRoot) {
                    return false;
                }

                return sourceRoot.contains(related);
            },

            initDesktopFlyouts() {
                if (this._flyoutsBound) {
                    return;
                }

                const navRoot = document.querySelector('.nav-scrollable');
                if (!navRoot) {
                    return;
                }

                this._onFlyoutOver = (event) => {
                    if (!this._isDesktopNav()) {
                        return;
                    }

                    const navRoot = document.querySelector('.nav-scrollable');
                    if (navRoot?.classList.contains('nav-flyouts-dismissed') &&
                        event.target.closest('.nav-item.nav-flyout > .nav-flyout-trigger')) {
                        navRoot.classList.remove('nav-flyouts-dismissed');
                    }

                    if (this._isFlyoutRelated(event.target)) {
                        this._openFlyoutPath(event.target);
                        return;
                    }

                    if (event.target.closest('.nav-item') && !event.target.closest('.nav-item.nav-flyout')) {
                        this._closeAllFlyouts();
                    }
                };

                this._onFlyoutOut = (event) => {
                    if (!this._isDesktopNav()) {
                        return;
                    }

                    const related = event.relatedTarget;
                    if (this._isWithinSameFlyoutRoot(event.target, related)) {
                        return;
                    }

                    const sourceRoot = event.target.closest('.nav-item.nav-flyout');
                    const relatedRoot = related instanceof Element
                        ? related.closest('.nav-item.nav-flyout')
                        : null;

                    if (sourceRoot && relatedRoot && relatedRoot !== sourceRoot) {
                        this._closeAllFlyouts();
                        return;
                    }

                    this._scheduleFlyoutClose();
                };

                navRoot.addEventListener('mouseover', this._onFlyoutOver);
                navRoot.addEventListener('mouseout', this._onFlyoutOut);
                navRoot.addEventListener('mouseleave', this._onFlyoutLeave = () => {
                    this.clearFlyoutDismissal();
                });
                this._flyoutsBound = true;
            },

            dispose() {
                if (this._closeTimer) {
                    clearTimeout(this._closeTimer);
                    this._closeTimer = null;
                }

                const navRoot = document.querySelector('.nav-scrollable');
                if (navRoot && this._onFlyoutOver && this._onFlyoutOut) {
                    navRoot.removeEventListener('mouseover', this._onFlyoutOver);
                    navRoot.removeEventListener('mouseout', this._onFlyoutOut);
                    if (this._onFlyoutLeave) {
                        navRoot.removeEventListener('mouseleave', this._onFlyoutLeave);
                    }
                }

                this._onFlyoutOver = null;
                this._onFlyoutOut = null;
                this._onFlyoutLeave = null;
                this._flyoutsBound = false;
                this.clearFlyoutDismissal();

                if (!this._initialized) {
                    return;
                }

                document.removeEventListener('mouseover', this._onMouseEnter);
                document.removeEventListener('mouseout', this._onMouseLeave);
                if (this._onFlyoutPosition) {
                    window.removeEventListener('resize', this._onFlyoutPosition);
                }
                this._onMouseEnter = null;
                this._onMouseLeave = null;
                this._onFlyoutPosition = null;
                this._initialized = false;
            },

            repositionBottomFlyouts(target) {
                if (!window.matchMedia('(min-width: 641px)').matches) {
                    return;
                }

                const bottomFlyout = target?.closest?.('.nav-flyout-bottom');
                if (!bottomFlyout) {
                    return;
                }

                const mainMenu = bottomFlyout.querySelector(':scope > .nav-flyout-menu');
                if (mainMenu) {
                    this.adjustBottomFlyout(mainMenu);
                }

                bottomFlyout.querySelectorAll('.nav-subflyout:hover').forEach((subflyout) => {
                    this.adjustSubflyout(subflyout);
                });
            },

            adjustBottomFlyout(menuEl) {
                if (!menuEl) {
                    return;
                }

                const margin = 12;
                menuEl.style.top = 'auto';
                menuEl.style.bottom = '0';

                const panel = menuEl.querySelector(':scope > .nav-flyout-panel');
                if (!panel) {
                    return;
                }

                panel.style.maxHeight = '';
                panel.style.overflowY = '';
                panel.scrollTop = 0;

                const flyout = menuEl.closest('.nav-flyout');
                const trigger = flyout?.querySelector(':scope > .nav-flyout-trigger');
                const triggerRect = trigger?.getBoundingClientRect();
                const availableHeight = triggerRect
                    ? triggerRect.bottom - margin
                    : window.innerHeight - margin * 2;

                if (panel.classList.contains('nav-flyout-panel-subflyouts') || panel.querySelector('.nav-subflyout')) {
                    panel.style.maxHeight = '';
                    panel.style.overflowY = '';
                    panel.style.overflowX = '';
                    return;
                }

                panel.style.maxHeight = `${Math.max(240, Math.min(availableHeight, window.innerHeight * 0.7))}px`;
                panel.style.overflowY = 'auto';
                panel.scrollTop = 0;
            },

            resetBottomFlyout(menuEl) {
                if (!menuEl) {
                    return;
                }

                menuEl.style.top = '';
                menuEl.style.bottom = '';

                const panel = menuEl.querySelector(':scope > .nav-flyout-panel');
                if (!panel) {
                    return;
                }

                panel.style.maxHeight = '';
                panel.style.overflowY = '';
                panel.scrollTop = 0;
            },

            adjustSubflyout(subflyoutEl) {
                const menuEl = subflyoutEl.querySelector(':scope > .nav-subflyout-menu');
                if (!menuEl) {
                    return;
                }

                const margin = 12;
                menuEl.classList.add('nav-subflyout-menu-up');
                menuEl.style.top = 'auto';
                menuEl.style.bottom = '0';

                const panel = menuEl.querySelector(':scope > .nav-flyout-panel');
                if (panel) {
                    panel.style.maxHeight = '';
                    panel.style.overflowY = '';
                    panel.scrollTop = 0;
                }

                const rect = menuEl.getBoundingClientRect();
                if (rect.top < margin) {
                    menuEl.classList.remove('nav-subflyout-menu-up');
                    menuEl.style.top = '0';
                    menuEl.style.bottom = 'auto';
                }

                if (!panel) {
                    return;
                }

                if (panel.querySelector('.nav-subflyout') || panel.classList.contains('nav-flyout-panel-subflyouts')) {
                    panel.style.maxHeight = '';
                    panel.style.overflowY = '';
                    panel.style.overflowX = '';
                    return;
                }

                const panelRect = panel.getBoundingClientRect();
                const availableHeight = panelRect.bottom - margin;
                panel.style.maxHeight = `${Math.max(200, Math.min(availableHeight, window.innerHeight * 0.65))}px`;
                panel.style.overflowY = 'auto';
                panel.scrollTop = 0;
            },

            resetSubflyout(subflyoutEl) {
                const menuEl = subflyoutEl.querySelector(':scope > .nav-subflyout-menu');
                if (!menuEl) {
                    return;
                }

                menuEl.classList.remove('nav-subflyout-menu-up');
                menuEl.style.top = '';
                menuEl.style.bottom = '';

                const panel = menuEl.querySelector(':scope > .nav-flyout-panel');
                if (!panel) {
                    return;
                }

                panel.style.maxHeight = '';
                panel.style.overflowY = '';
                panel.scrollTop = 0;
            }
        };
    </script>
</body>

</html>
